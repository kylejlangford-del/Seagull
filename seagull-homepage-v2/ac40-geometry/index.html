<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AC40 Geometry · Seagull Lab</title>
  <style>
    :root {
      --bg: #07111d;
      --line: rgba(115, 135, 160, 0.20);
      --text: #eff5fb;
      --muted: #98a8ba;
      --accent: #47e7db;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, #0b1522 0%, #07111d 70%);
      color: var(--text);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(1200px, calc(100% - 40px));
      margin: 0 auto;
      padding: 34px 0 80px;
    }
    a { color: var(--muted); text-decoration: none; }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 22px;
      border-bottom: 1px solid var(--line);
    }
    .hero { padding-top: 90px; }
    .eyebrow {
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: .2em;
      font-size: .72rem;
      font-weight: 700;
    }
    h1 {
      margin: 18px 0 20px;
      font-size: clamp(3.5rem, 9vw, 7rem);
      line-height: .9;
      letter-spacing: -.065em;
    }
    p {
      max-width: 640px;
      color: var(--muted);
      line-height: 1.68;
      font-size: 1.05rem;
    }
  </style>
</head>
<body>
  <main>
    <div class="top">
      <a href="../">← Seagull Lab</a>
      <span style="color:#98a8ba;font-size:.78rem;text-transform:uppercase;letter-spacing:.16em;">Tool page</span>
    </div>
    <section class="hero">
      <span class="eyebrow">Performance tool</span>
      <h1>AC40 Geometry</h1>
      <p>This is the page where the interactive geometry app will sit.</p>
    </section>
  </main>
</body>
</html>
